<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design Asset · Glass Workspace</title>
<link rel="stylesheet" href="../../src/renderer/styles/design-system.css">
<style>
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}h1,h2,h3,p{margin:0}button,a{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}button{color:inherit;background:transparent;border:0}svg.icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.demo-brand{font-size:23px}.workspace-rail-footer{margin-top:auto}.demo-sidebar-note{margin:auto 10px 8px;padding-top:32px;font-size:11px;line-height:1.9;color:var(--ui-muted)}.demo-main{padding:31px 32px 28px;overflow:auto;flex:1;min-width:0;transition:margin 180ms}.demo-main.has-detail{margin-right:294px}.hero{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}.hero h1{font-size:32px;letter-spacing:-.055em;font-weight:620;margin-bottom:7px}.hero p{color:var(--ui-muted);font-size:12px}.hero .ui-eyebrow{margin-bottom:8px}.demo-search{margin-bottom:19px}.demo-count{display:flex;align-items:center;justify-content:space-between;color:var(--ui-muted);font-size:11px;margin-bottom:19px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--demo-width,205px)),1fr));gap:21px;align-items:start}.sample{padding:7px;text-align:left;border-radius:19px;border:1px solid color-mix(in srgb,var(--ui-border) 70%,transparent);background:var(--ui-surface);box-shadow:0 6px 19px -13px rgba(29,48,80,.27);transition:transform 180ms,box-shadow 180ms;min-width:0}.sample:hover{transform:translateY(-3px);box-shadow:0 14px 25px -13px rgba(29,48,80,.32)}.sample[aria-pressed=true]{border-color:var(--ui-accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--ui-accent) 55%,transparent)}.art{width:100%;display:block;aspect-ratio:4/3;border-radius:12px;overflow:hidden}.sample h3{font-size:12px;font-weight:570;margin:11px 7px 4px}.sample p{margin:0 7px 9px;font-size:10px;color:var(--ui-muted)}.demo-inspector{position:absolute;right:12px;top:78px;bottom:12px;width:282px;padding:21px;background:var(--glass-dense);border:1px solid var(--glass-edge);border-radius:23px;box-shadow:var(--glass-shadow);backdrop-filter:var(--glass-blur);overflow:auto}.demo-inspector .art{margin:20px 0}.detail-title{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:550}.detail-name{font-size:20px;letter-spacing:-.035em;margin:16px 0 6px}.detail-row{display:flex;justify-content:space-between;font-size:11px;padding:10px 0;border-bottom:1px solid var(--glass-edge)}.detail-row span:first-child{color:var(--ui-muted)}.detail-tags{display:flex;gap:6px;margin-top:20px}.detail-note{margin-top:22px;font-size:11px;line-height:1.9;color:var(--ui-muted)}.footer-note{font-size:10px;color:var(--ui-muted);margin-top:26px;display:flex;justify-content:space-between;gap:16px}.kbd{font-size:10px;color:var(--ui-muted);padding:3px 7px;border:1px solid var(--glass-edge);border-radius:6px;white-space:nowrap}.demo-controls{display:flex;align-items:center;gap:10px}.demo-density{width:70px;accent-color:var(--ui-accent)}.demo-dialog{border:1px solid var(--glass-edge);border-radius:25px;background:var(--glass-dense);color:var(--ui-text);box-shadow:var(--glass-shadow);padding:28px;width:min(540px,90vw);backdrop-filter:var(--glass-blur);outline:none}.demo-dialog::backdrop{background:rgba(16,30,52,.4);backdrop-filter:blur(8px)}.demo-dialog h2{font-size:22px;margin-bottom:15px;letter-spacing:-.035em}.demo-dialog p{font-size:13px;color:var(--ui-muted);line-height:1.9;margin-bottom:15px}.demo-dialog .ui-actions{justify-content:flex-end;margin-top:24px}.preview-dialog{width:min(880px,92vw);background:rgba(22,34,51,.96);color:#fff}.preview-dialog .art{margin:20px 0;max-height:65vh;aspect-ratio:auto}.preview-dialog .detail-title{color:#f1f5fc}.empty{padding:80px;text-align:center;color:var(--ui-muted)}[hidden]{display:none!important}.dark{color-scheme:dark}@media(max-width:1000px){.workspace-shell{grid-template-columns:185px minmax(0,1fr)}.demo-main{padding:24px}.demo-main.has-detail{margin-right:0}.demo-inspector{z-index:5;box-shadow:0 0 0 200vw rgba(12,26,46,.2),var(--glass-shadow)}.workspace-titlebar-caption,.workspace-rail-footer{margin-top:auto}.demo-sidebar-note{display:none}.hero h1{font-size:27px}.footer-note{flex-direction:column}.library-collection-rail{padding-inline:20px}}@media(prefers-reduced-motion:reduce){.sample,.demo-main{transition:none}}

.demo-inspector { animation: inspector-enter 240ms cubic-bezier(.22,1,.36,1); }
.demo-dialog[open] { animation: dialog-enter 230ms cubic-bezier(.22,1,.36,1); }
.collection-filter { transition: background 160ms, color 160ms; }
@keyframes inspector-enter { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:none; } }
@keyframes dialog-enter { from { opacity:0; transform:translateY(8px) scale(.98); } to { opacity:1; transform:none; } }
@media(max-width:1000px){.workspace-titlebar .ui-status{display:none}}
@media(prefers-reduced-motion:reduce){.demo-inspector,.demo-dialog[open]{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></symbol>
<symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
<symbol id="folder" viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h5l3 4h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8Z"/></symbol>
<symbol id="link" viewBox="0 0 24 24"><path d="m10 13 4-4m-6 7-1 1a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m0 12a4 4 0 0 0 6 0l5-5a4 4 0 0 0-6-6l-1 1" transform="translate(1 0) scale(.9)"/></symbol>
<symbol id="tag" viewBox="0 0 24 24"><path d="M3 3h9l9 9-9 9-9-9V3Z"/><circle cx="8" cy="8" r="1"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></symbol>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></symbol>
<symbol id="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
</defs></svg>
<div class="workspace-shell">
<aside class="workspace-rail">
<a href="#" class="workspace-brand" aria-label="Design Asset 首页"><span class="workspace-brand-mark"><svg class="icon"><use href="#layers"/></svg></span><span class="workspace-brand-name">Design Asset<span class="workspace-brand-caption">A place for inspiration.</span></span></a>
<div class="workspace-rail-heading">资料库</div>
<a href="#" class="workspace-rail-link" aria-current="page"><svg class="icon"><use href="#grid"/></svg>我的素材</a>
<button class="workspace-rail-link" data-explain="连接库使用同一份 Eagle 原件，通过既有连接流程管理同步和冲突。此处为设计展示，没有连接真实 Eagle。"><svg class="icon"><use href="#link"/></svg>Eagle 连接库</button>
<button class="workspace-rail-link" data-explain="旧素材使用独立的只读找回流程：选择数据库、选择素材目录、确认只读访问。"><svg class="icon"><use href="#folder"/></svg>找回旧素材</button>
<button class="workspace-rail-link" data-explain="标签辅助整理，未分类也可以正常收录和搜索。本展示的标签仅用于筛选原创示例。"><svg class="icon"><use href="#tag"/></svg>标签</button>
<button class="workspace-rail-link" data-explain="网页采集是现有独立工作区；本页展示不执行下载或网络采集。"><svg class="icon"><use href="#globe"/></svg>网页采集</button>
<div class="demo-sidebar-note">为灵感留一处空间。<br>把更多注意力，交还创作。</div>
<div class="workspace-rail-footer"><button class="workspace-rail-link" style="width:100%" id="theme-toggle" aria-pressed="false"><svg class="icon"><use href="#sun"/></svg><span>切换深色模式</span></button></div>
</aside>
<main class="workspace-stage">
<header class="workspace-titlebar"><div><span class="workspace-titlebar-title">我的素材</span><span class="workspace-titlebar-caption">Personal workspace</span></div><div class="demo-controls"><span class="ui-status" data-tone="accent">交互设计预览</span><button class="ui-button ui-button-ghost" id="motion-replay">重播动效</button><button class="ui-button ui-button-ghost" id="about">设计说明</button></div></header>
<div class="workspace-content" style="display:flex;flex-direction:column">
<nav class="library-collection-rail" aria-label="示例筛选"><div class="collection-shortcuts"><button class="collection-filter" data-filter="" aria-pressed="true">全部素材 <span>8</span></button><button class="collection-filter" data-filter="建筑" aria-pressed="false">建筑空间</button><button class="collection-filter" data-filter="自然" aria-pressed="false">自然光影</button></div><div class="collection-tags"><button class="collection-filter" data-filter="平面" aria-pressed="false"># 平面设计</button><button class="collection-filter" data-filter="材质" aria-pressed="false"># 材质</button></div></nav>
<section class="demo-main" id="main">
<div class="hero"><div><div class="ui-eyebrow">YOUR CREATIVE COLLECTION</div><h1>灵感，触手可及。</h1><p>收集所爱，让每一次发现成为下一次创作的起点。</p></div><button class="ui-button ui-button-primary" data-explain="在应用内，添加素材会打开系统文件选择器，再展示复制确认浮层。确认后才收录，来源文件保持不变。本设计展示不会读取你的文件。">＋ 添加素材</button></div>
<div class="library-searchbar demo-search"><svg class="icon" style="margin-left:9px"><use href="#search"/></svg><input id="search-field" aria-label="搜索示例素材" placeholder="搜索灵感、名称或标签" autocomplete="off"><span class="kbd">⌘ F</span><button class="ui-button ui-button-ghost" id="clear" aria-label="清除搜索">清除</button></div>
<div class="demo-count"><span id="count">8 个素材</span><label class="demo-controls">缩略图 <input class="demo-density" aria-label="缩略图大小" type="range" min="175" max="280" step="15" value="205"></label></div>
<div class="gallery" id="gallery"></div><p class="empty" id="empty" hidden>没有匹配的素材，试试其他关键词。</p>
<div class="footer-note"><span>单击检查 · 双击 / 空格快速查看 · Esc 返回</span><span>原创图形示例 · 不包含用户素材</span></div>
</section>
<aside class="demo-inspector" id="inspector" aria-label="素材信息" hidden></aside>
</div>
</main>
</div>
<dialog class="demo-dialog" id="info"><h2>安静、通透，也顺手。</h2><p id="explanation"></p><label class="ui-meta"><input type="checkbox" id="reduce"> 减少透明效果</label><div class="ui-actions"><button class="ui-button ui-button-primary" id="info-close">完成</button></div></dialog>
<dialog class="demo-dialog preview-dialog" id="preview"><div class="detail-title"><span id="preview-title"></span><button class="ui-button ui-button-secondary" id="preview-close" aria-label="关闭快速查看">完成</button></div><div id="preview-art"></div></dialog>
<script>
const svg=(body,defs='')=>`<svg class="art" viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="原创设计示例"><defs>${defs}</defs>${body}</svg>`;
const grad=(id,a,b)=>`<linearGradient id="${id}" x2="1" y2="1"><stop stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const items=[
{name:'海岸的蓝色时刻',tag:'自然',kind:'色彩研究',art:svg('<rect width="600" height="450" fill="url(#sea)"/><circle cx="440" cy="120" r="54" fill="#ffe7c5"/><path d="M0 275Q160 175 290 280T600 240V450H0Z" fill="#456e91"/><path d="M0 345Q230 225 390 338T600 310V450H0Z" fill="#284e72"/><path d="M0 415Q150 320 340 390T600 370V450H0Z" fill="#adc5c7"/><path d="M0 436Q150 340 340 412T600 393" fill="none" stroke="#e4e6d5" stroke-width="4"/>',grad('sea','#b2c8d1','#f2d5b8'))},
{name:'光穿过拱门',tag:'建筑',kind:'空间与结构',art:svg('<rect width="600" height="450" fill="#d7c7b1"/><path d="M115 450V205a185 185 0 0 1 370 0v245" fill="#a4927d"/><path d="M165 450V215a135 135 0 0 1 270 0v235" fill="url(#arch)"/><path d="m165 450 160-280h110v280" fill="#d6c9a7"/><path d="m210 450 155-235h70v235" fill="#f0e6cf"/><path d="M0 416h600v34H0" fill="#a58d75"/><path d="m165 416 270-62v62" fill="#e2cfad"/>',grad('arch','#374b45','#829483'))},
{name:'有机的秩序',tag:'平面',kind:'编辑设计',art:svg('<rect width="600" height="450" fill="#e6e9d9"/><text x="36" y="51" font-size="13" fill="#35473c" font-family="sans-serif" letter-spacing="3">STUDIES IN NATURE / 03</text><ellipse cx="399" cy="260" rx="93" ry="184" transform="rotate(32 399 260)" fill="#5d7661"/><ellipse cx="393" cy="242" rx="62" ry="175" transform="rotate(-20 393 242)" fill="#95a283"/><text x="35" y="215" font-size="72" fill="#263d31" font-family="serif">Organic</text><text x="35" y="283" font-size="72" fill="#263d31" font-family="serif">rhythm.</text><text x="36" y="410" font-size="11" fill="#35473c" font-family="sans-serif" letter-spacing="2">FORM · LIGHT · PERSPECTIVE</text>')},
{name:'流动的银',tag:'材质',kind:'形态探索',art:svg('<rect width="600" height="450" fill="url(#metalbg)"/><path d="M-40 315C110 30 240 400 640 100" stroke="url(#metal)" stroke-width="110" fill="none"/><path d="M-40 312C110 27 240 397 640 97" stroke="#fff" stroke-opacity=".7" stroke-width="2" fill="none"/>',grad('metalbg','#f1eff4','#b7c0d4')+'<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4a576e"/><stop offset=".3" stop-color="#fcfeff"/><stop offset=".53" stop-color="#a8b2c3"/><stop offset=".7" stop-color="#566078"/><stop offset="1" stop-color="#dae1ed"/></linearGradient>')},
{name:'静谧的沙丘',tag:'自然',kind:'风景与层次',art:svg('<rect width="600" height="450" fill="#e3d7c9"/><circle cx="430" cy="111" r="38" fill="#fff1d9"/><path d="M0 300Q250 120 600 280V450H0Z" fill="#c1a48a"/><path d="M0 450Q130 140 600 330V450Z" fill="url(#dune)"/><path d="M0 450Q130 140 600 330Q280 265 265 450Z" fill="#e8c7a1"/>',grad('dune','#9c6c52','#c69571'))},
{name:'柔和的几何',tag:'平面',kind:'品牌与排版',art:svg('<rect width="600" height="450" fill="#414fbd"/><circle cx="505" cy="338" r="153" fill="none" stroke="#cdbbdf" stroke-width="63"/><text x="35" y="53" font-size="13" fill="#efeddf" font-family="sans-serif" letter-spacing="3">A LITTLE MORE SPACE</text><text x="35" y="221" font-size="82" fill="#f4efce" font-family="serif">Make</text><text x="35" y="301" font-size="82" fill="#f4efce" font-family="serif">room.</text><text x="36" y="410" font-size="11" fill="#efeddf" font-family="sans-serif" letter-spacing="2">COLOUR EXPLORATIONS / 06</text>')},
{name:'山间晨雾',tag:'自然',kind:'氛围与光线',art:svg('<rect width="600" height="450" fill="url(#mist)"/><path d="m0 300 170-150 120 90 160-110 150 110v210H0" fill="#8aabb0"/><path d="m0 360 140-150 160 130 160-150 140 100v160H0" fill="#6d9297"/><path d="m0 400 120-80 160 100 170-140 150 100v70H0" fill="#3f6e75"/><path d="M0 360q300-80 600-30v120H0Z" fill="url(#fog)"/>',grad('mist','#c7d8d9','#eee8d7')+'<linearGradient id="fog" x2="0" y2="1"><stop stop-color="#e3e5d8" stop-opacity="0"/><stop offset="1" stop-color="#e3e5d8" stop-opacity=".85"/></linearGradient>')},
{name:'午后的转角',tag:'建筑',kind:'光影与材质',art:svg('<rect width="600" height="450" fill="#d5bca6"/><path d="M0 0h250v450H0Z" fill="#bca187"/><path d="m250 0 350 110v340H250" fill="#e5d5c0"/><path d="m250 240 350-140v66L250 308" fill="#f5e9d5"/><path d="M290 265h150v185H290Z" fill="#917c66"/><path d="M314 286h103v164H314Z" fill="#485852"/><path d="m0 450 250-100 350 30v70" fill="#b1977c"/><path d="m250 350 350-20v50Z" fill="#ebdac3"/>')}
];
let filter='',selected=-1,lastCard=null;const gallery=document.querySelector('#gallery'),search=document.querySelector('#search-field'),inspector=document.querySelector('#inspector'),main=document.querySelector('#main'),preview=document.querySelector('#preview'),info=document.querySelector('#info');
function render(){const visible=items.map((item,index)=>({...item,index})).filter(i=>(!filter||i.tag===filter)&&[i.name,i.tag,i.kind].join(' ').includes(search.value.trim()));gallery.innerHTML=visible.map(i=>`<button class="sample" data-index="${i.index}" aria-pressed="${selected===i.index}" aria-label="查看素材：${i.name}">${i.art}<h3>${i.name}</h3><p>${i.kind} · ${i.tag}</p></button>`).join('');document.querySelector('#count').textContent=`${visible.length} 个素材`;document.querySelector('#empty').hidden=visible.length>0;}
function closeDetail(){inspector.hidden=true;main.classList.remove('has-detail');selected=-1;gallery.querySelectorAll('.sample').forEach(b=>b.setAttribute('aria-pressed','false'));lastCard?.focus();}
function select(index,card){selected=index;lastCard=card;const i=items[index];gallery.querySelectorAll('.sample').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.index)===index)));inspector.innerHTML=`<div class="detail-title">素材信息<button class="ui-button ui-button-ghost" id="detail-close" aria-label="关闭素材信息">✕</button></div>${i.art}<h2 class="detail-name">${i.name}</h2><p class="ui-meta">${i.kind}</p><hr class="ui-divider"><div class="detail-row"><span>类型</span><span>原创矢量图形</span></div><div class="detail-row"><span>画布</span><span>600 × 450</span></div><div class="detail-row"><span>来源</span><span>设计系统示例</span></div><div class="detail-tags"><span class="ui-status" data-tone="accent">${i.tag}</span></div><p class="detail-note">保留原始画面，让信息和操作在需要时出现。</p><button id="detail-preview" class="ui-button ui-button-secondary" style="margin-top:20px;width:100%">快速查看 <span class="kbd">空格</span></button>`;inspector.hidden=false;main.classList.add('has-detail');document.querySelector('#detail-close').onclick=closeDetail;document.querySelector('#detail-preview').onclick=()=>showPreview(index);}
function showPreview(index){document.querySelector('#preview-title').textContent=items[index].name;document.querySelector('#preview-art').innerHTML=items[index].art;preview.showModal();}
gallery.onclick=e=>{const b=e.target.closest('.sample');if(b)select(Number(b.dataset.index),b)};gallery.ondblclick=e=>{const b=e.target.closest('.sample');if(b)showPreview(Number(b.dataset.index))};gallery.onkeydown=e=>{const b=e.target.closest('.sample');if(b&&e.key===' '&&!e.repeat){e.preventDefault();showPreview(Number(b.dataset.index));}};
search.oninput=render;document.querySelector('#clear').onclick=()=>{search.value='';render();search.focus()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(n=>n.setAttribute('aria-pressed',String(n===b)));closeDetail();render();});
document.querySelector('#theme-toggle').onclick=function(){const dark=document.documentElement.classList.toggle('dark');this.querySelector('span').textContent=dark?'切换浅色模式':'切换深色模式';this.setAttribute('aria-pressed',String(dark));};document.querySelector('.demo-density').oninput=e=>gallery.style.setProperty('--demo-width',e.target.value+'px');
function explain(text){document.querySelector('#explanation').textContent=text;info.showModal();}document.querySelectorAll('[data-explain]').forEach(b=>b.onclick=()=>explain(b.dataset.explain));document.querySelector('#about').onclick=()=>explain('磨砂玻璃用于侧栏、工具栏和临时操作层；素材卡片保持清晰。动效以 140–240ms 的轻位移、淡入淡出和选中位置过渡表达关系。实际应用的设置、标签、来源、下载及 AI 页面共享视觉与动效规范。单击检查、双击或空格快速查看，⌘F 搜索，Escape 关闭当前浮层并返回。这是基于同一生产样式的可交互设计展示；应用以 Electron/CSS 实现 Apple 风格，不冒充原生 Liquid Glass。');document.querySelector('#reduce').onchange=e=>document.documentElement.classList.toggle('reduce-transparency',e.target.checked);document.querySelector('#motion-replay').onclick=()=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;gallery.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],{duration:260,easing:'cubic-bezier(.22,1,.36,1)'});};document.querySelector('#info-close').onclick=()=>info.close();document.querySelector('#preview-close').onclick=()=>preview.close();
document.addEventListener('keydown',e=>{if(info.open||preview.open)return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='f'){e.preventDefault();search.focus();search.select();}else if(e.key==='Escape'&&!inspector.hidden&&e.target!==search){e.preventDefault();closeDetail();}});render();
</script>
</body></html>
